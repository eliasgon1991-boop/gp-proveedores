name: Desplegar en GitHub Pages (DESACTIVADO: la app vive en Vercel)

# 02-09-2026: producción se movió a Vercel (proveedores.gestorpublico.cl).
# Este workflow queda solo con disparo manual por si hiciera falta volver.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Clave publicable (no secreta): la protección real es RLS en Supabase.
          VITE_SUPABASE_URL: https://kmotfygtwxlbmyqdqjfu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_P_x5gTjCf4g63CmGOhSFAw_XbaoAuhx
      - run: echo proveedores.gestorpublico.cl > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
